<div class="page-header">
  <h1 class="title">課程群組 CourseGroup <span class="subtitle">課程分類群組代碼</span></h1>
  <div class="actions">
    <p-button
      label="搜尋條件"
      icon="pi pi-filter"
      severity="secondary"
      [badge]="activeFilterCount() ? '' + activeFilterCount() : undefined"
      badgeSeverity="success"
      (onClick)="drawerVisible = true"
    />
    <p-button label="新增" icon="pi pi-plus" (onClick)="add()" />
  </div>
</div>

<div class="table-card">
  <p-table
    [value]="items()"
    [loading]="loading()"
    dataKey="pkid"
    [paginator]="true"
    paginatorPosition="top"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    [tableStyle]="{ 'min-width': '40rem' }"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="description">群組名稱 <p-sortIcon field="description" /></th>
        <th class="text-center" style="width: 11rem">操作</th>
      </tr>
    </ng-template>
    <ng-template #body let-item>
      <tr>
        <td>{{ item.pkid }}</td>
        <td>
          <a [routerLink]="['/course-groups', item.pkid]" class="link">{{ item.description }}</a>
        </td>
        <td>
          <div class="row-actions">
            <p-button
              icon="pi pi-book"
              [text]="true"
              [rounded]="true"
              severity="help"
              pTooltip="查看課程"
              ariaLabel="查看課程"
              [routerLink]="['/courses']"
              [queryParams]="{ courseGroupPkid: item.pkid }"
            />
            <p-button
              icon="pi pi-eye"
              [text]="true"
              [rounded]="true"
              severity="secondary"
              pTooltip="檢視"
              ariaLabel="檢視"
              [routerLink]="['/course-groups', item.pkid]"
            />
            <p-button
              icon="pi pi-pencil"
              [text]="true"
              [rounded]="true"
              severity="info"
              pTooltip="編輯"
              ariaLabel="編輯"
              [routerLink]="['/course-groups', item.pkid, 'edit']"
            />
            <p-button
              icon="pi pi-trash"
              [text]="true"
              [rounded]="true"
              severity="danger"
              pTooltip="刪除"
              ariaLabel="刪除"
              (onClick)="confirmDelete(item)"
            />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="3" class="text-center text-muted empty">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer [(visible)]="drawerVisible" position="right" header="搜尋條件" styleClass="filter-drawer">
  <form (ngSubmit)="search()">
    <div class="field">
      <label for="f-keyword">關鍵字</label>
      <input
        pInputText
        id="f-keyword"
        name="keyword"
        [(ngModel)]="filters.keyword"
        placeholder="群組名稱"
      />
    </div>

    <div class="drawer-actions">
      <p-button
        type="button"
        label="清除"
        icon="pi pi-times"
        severity="secondary"
        (onClick)="clearFilters()"
      />
      <p-button type="submit" label="查詢" icon="pi pi-search" />
    </div>
  </form>
</p-drawer>
