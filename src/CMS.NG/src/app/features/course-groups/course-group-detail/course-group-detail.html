<div class="page-header">
  <h1 class="title">檢視課程群組</h1>
  <div class="actions">
    <p-button label="返回" icon="pi pi-arrow-left" severity="secondary" (onClick)="back()" />
    @if (item()) {
      <p-button
        label="刪除"
        icon="pi pi-trash"
        severity="danger"
        [outlined]="true"
        (onClick)="confirmDelete()"
      />
      <p-button label="編輯" icon="pi pi-pencil" (onClick)="edit()" />
    }
  </div>
</div>

@if (loading()) {
  <div class="panel text-muted"><i class="pi pi-spin pi-spinner"></i> 載入中…</div>
} @else if (notFound()) {
  <div class="panel text-muted not-found">找不到此課程群組資料</div>
} @else if (item(); as g) {
  <section class="panel">
    <h2>課程群組資料</h2>
    <dl class="view-grid">
      <dt>主代碼</dt>
      <dd>{{ g.pkid }}</dd>
      <dt>群組名稱</dt>
      <dd class="description">{{ g.description }}</dd>
    </dl>
  </section>
}
