<div class="page-header">
  <h1 class="title">角色 AppRole <span class="subtitle">使用者角色</span></h1>
  <div class="actions">
    <p-button
      label="搜尋條件"
      icon="pi pi-filter"
      severity="secondary"
      [badge]="activeFilterCount() ? '' + activeFilterCount() : undefined"
      badgeSeverity="success"
      (onClick)="drawerVisible = true"
    />
    <p-button label="新增" icon="pi pi-plus" (onClick)="add()" />
  </div>
</div>

<div class="table-card">
  <p-table
    [value]="items()"
    [loading]="loading()"
    dataKey="pkid"
    [paginator]="true"
    paginatorPosition="top"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    [tableStyle]="{ 'min-width': '60rem' }"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="roleId">角色代碼 <p-sortIcon field="roleId" /></th>
        <th pSortableColumn="roleName">角色名稱 <p-sortIcon field="roleName" /></th>
        <th pSortableColumn="permissionLevel" class="text-center" style="width: 8rem">
          權限等級 <p-sortIcon field="permissionLevel" />
        </th>
        <th pSortableColumn="description">描述 <p-sortIcon field="description" /></th>
        <th pSortableColumn="userCount" class="text-center" style="width: 8rem">
          使用者數 <p-sortIcon field="userCount" />
        </th>
        <th class="text-center" style="width: 9rem">操作</th>
      </tr>
    </ng-template>
    <ng-template #body let-item>
      <tr>
        <td>{{ item.pkid }}</td>
        <td>
          <a [routerLink]="['/app-roles', item.pkid]" class="link">{{ item.roleId }}</a>
        </td>
        <td>{{ item.roleName }}</td>
        <td class="text-center">{{ item.permissionLevel }}</td>
        <td>{{ item.description }}</td>
        <td class="text-center">{{ item.userCount }}</td>
        <td>
          <div class="row-actions">
            <p-button
              icon="pi pi-eye"
              [text]="true"
              [rounded]="true"
              severity="secondary"
              pTooltip="檢視"
              ariaLabel="檢視"
              [routerLink]="['/app-roles', item.pkid]"
            />
            <p-button
              icon="pi pi-pencil"
              [text]="true"
              [rounded]="true"
              severity="info"
              pTooltip="編輯"
              ariaLabel="編輯"
              [routerLink]="['/app-roles', item.pkid, 'edit']"
            />
            <p-button
              icon="pi pi-trash"
              [text]="true"
              [rounded]="true"
              severity="danger"
              pTooltip="刪除"
              ariaLabel="刪除"
              (onClick)="confirmDelete(item)"
            />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="7" class="text-center text-muted empty">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer [(visible)]="drawerVisible" position="right" header="搜尋條件" styleClass="filter-drawer">
  <form (ngSubmit)="search()">
    <div class="field">
      <label for="f-keyword">關鍵字</label>
      <input
        pInputText
        id="f-keyword"
        name="keyword"
        [(ngModel)]="filters.keyword"
        placeholder="角色代碼、角色名稱、描述"
      />
    </div>

    <div class="field">
      <label for="f-plFrom">權限等級</label>
      <div class="range">
        <p-inputnumber
          inputId="f-plFrom"
          name="permissionLevelFrom"
          [(ngModel)]="filters.permissionLevelFrom"
          [useGrouping]="false"
          placeholder="起"
        />
        <span>～</span>
        <p-inputnumber
          inputId="f-plTo"
          name="permissionLevelTo"
          [(ngModel)]="filters.permissionLevelTo"
          [useGrouping]="false"
          placeholder="迄"
        />
      </div>
    </div>

    <div class="field">
      <label for="f-user">使用者</label>
      <p-select
        inputId="f-user"
        name="userId"
        [(ngModel)]="filters.userId"
        [options]="userOptions"
        optionLabel="label"
        optionValue="pkid"
        [showClear]="true"
        [filter]="userOptions.length >= 10"
        placeholder="全部"
        appendTo="body"
      />
    </div>

    <div class="drawer-actions">
      <p-button type="button" label="清除" icon="pi pi-times" severity="secondary" (onClick)="clearFilters()" />
      <p-button type="submit" label="查詢" icon="pi pi-search" />
    </div>
  </form>
</p-drawer>
