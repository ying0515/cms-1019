<div class="page-header">
  <h1 class="title">使用者 AppUser <span class="subtitle">後台登入帳號</span></h1>
  <div class="actions">
    <p-button
      label="搜尋條件"
      icon="pi pi-filter"
      severity="secondary"
      [badge]="activeFilterCount() ? '' + activeFilterCount() : undefined"
      badgeSeverity="success"
      (onClick)="drawerVisible = true"
    />
    <p-button label="新增" icon="pi pi-plus" (onClick)="add()" />
  </div>
</div>

<div class="table-card">
  <p-table
    [value]="items()"
    [loading]="loading()"
    dataKey="pkid"
    [paginator]="true"
    paginatorPosition="top"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    [tableStyle]="{ 'min-width': '60rem' }"
  >
    <ng-template #header>
      <tr>
        <th scope="col" pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th scope="col" pSortableColumn="userId">使用者帳號 <p-sortIcon field="userId" /></th>
        <th scope="col" pSortableColumn="userName">使用者名稱 <p-sortIcon field="userName" /></th>
        <th scope="col" pSortableColumn="isActive" class="text-center" style="width: 7rem">
          啟用 <p-sortIcon field="isActive" />
        </th>
        <th scope="col" pSortableColumn="passwordUpdatedTime" style="width: 11rem">
          密碼更新時間 <p-sortIcon field="passwordUpdatedTime" />
        </th>
        <th scope="col" pSortableColumn="roleCount" class="text-center" style="width: 7rem">
          角色數 <p-sortIcon field="roleCount" />
        </th>
        <th scope="col" class="text-center" style="width: 11rem">操作</th>
      </tr>
    </ng-template>
    <ng-template #body let-item>
      <tr>
        <td>{{ item.pkid }}</td>
        <td>
          <a [routerLink]="['/app-users', item.pkid]" class="link">{{ item.userId }}</a>
        </td>
        <td>{{ item.userName }}</td>
        <td class="text-center">
          <i
            [class]="item.isActive ? 'pi pi-check flag-on' : 'pi pi-minus text-muted'"
            [attr.aria-label]="item.isActive ? '是' : '否'"
          ></i>
        </td>
        <td>
          @if (item.passwordUpdatedTime) {
            {{ item.passwordUpdatedTime + 'Z' | date: 'yyyy-MM-dd HH:mm' }}
          } @else {
            <span class="text-muted">—</span>
          }
        </td>
        <td class="text-center">{{ item.roleCount }}</td>
        <td>
          <div class="row-actions">
            <p-button
              icon="pi pi-id-card"
              [text]="true"
              [rounded]="true"
              severity="help"
              pTooltip="查看角色"
              ariaLabel="查看角色"
              [routerLink]="['/app-roles']"
              [queryParams]="{ userId: item.userId }"
            />
            <p-button
              icon="pi pi-eye"
              [text]="true"
              [rounded]="true"
              severity="secondary"
              pTooltip="檢視"
              ariaLabel="檢視"
              [routerLink]="['/app-users', item.pkid]"
            />
            <p-button
              icon="pi pi-pencil"
              [text]="true"
              [rounded]="true"
              severity="info"
              pTooltip="編輯"
              ariaLabel="編輯"
              [routerLink]="['/app-users', item.pkid, 'edit']"
            />
            <p-button
              icon="pi pi-trash"
              [text]="true"
              [rounded]="true"
              severity="danger"
              pTooltip="刪除"
              ariaLabel="刪除"
              (onClick)="confirmDelete(item)"
            />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="7" class="text-center text-muted empty">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer [(visible)]="drawerVisible" position="right" header="搜尋條件" styleClass="filter-drawer">
  <form (ngSubmit)="search()">
    <div class="field">
      <label for="f-keyword">關鍵字</label>
      <input
        pInputText
        id="f-keyword"
        name="keyword"
        [(ngModel)]="filters.keyword"
        placeholder="使用者帳號、使用者名稱"
      />
    </div>

    <div class="field">
      <label for="f-isActive">啟用</label>
      <p-select
        inputId="f-isActive"
        name="isActive"
        [(ngModel)]="filters.isActive"
        [options]="boolOptions"
        optionLabel="label"
        optionValue="pkid"
        [showClear]="true"
        placeholder="全部"
        appendTo="body"
      />
    </div>

    <div class="field">
      <label for="f-role">角色</label>
      <p-select
        inputId="f-role"
        name="roleId"
        [(ngModel)]="filters.roleId"
        [options]="roleOptions"
        optionLabel="label"
        optionValue="pkid"
        [showClear]="true"
        [filter]="roleOptions.length >= 10"
        placeholder="全部"
        appendTo="body"
      />
    </div>

    <div class="drawer-actions">
      <p-button
        type="button"
        label="清除"
        icon="pi pi-times"
        severity="secondary"
        (onClick)="clearFilters()"
      />
      <p-button type="submit" label="查詢" icon="pi pi-search" />
    </div>
  </form>
</p-drawer>
