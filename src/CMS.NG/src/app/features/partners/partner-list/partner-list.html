<div class="page-header">
  <h1 class="title">合作廠商 Partner <span class="subtitle">原廠／合作夥伴主資料</span></h1>
  <div class="actions">
    <p-button
      label="搜尋條件"
      icon="pi pi-filter"
      severity="secondary"
      [badge]="activeFilterCount() ? '' + activeFilterCount() : undefined"
      badgeSeverity="success"
      (onClick)="drawerVisible = true"
    />
    <p-button label="新增" icon="pi pi-plus" (onClick)="add()" />
  </div>
</div>

<div class="table-card">
  <p-table
    [value]="items()"
    [loading]="loading()"
    dataKey="pkid"
    [paginator]="true"
    paginatorPosition="top"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    [tableStyle]="{ 'min-width': '60rem' }"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="name">廠商名稱 <p-sortIcon field="name" /></th>
        <th pSortableColumn="appKey">應用代碼 <p-sortIcon field="appKey" /></th>
        <th pSortableColumn="nameOnPartnerMenu">
          廠商選單名稱 <p-sortIcon field="nameOnPartnerMenu" />
        </th>
        <th pSortableColumn="nameOnCourseDetailPage">
          課程頁顯示名稱 <p-sortIcon field="nameOnCourseDetailPage" />
        </th>
        <th pSortableColumn="displayOrder" class="text-center" style="width: 8rem">
          顯示順序 <p-sortIcon field="displayOrder" />
        </th>
        <th pSortableColumn="imageFilename">圖檔名稱 <p-sortIcon field="imageFilename" /></th>
        <th class="text-center" style="width: 9rem">操作</th>
      </tr>
    </ng-template>
    <ng-template #body let-item>
      <tr>
        <td>{{ item.pkid }}</td>
        <td>
          <a [routerLink]="['/partners', item.pkid]" class="link">{{ item.name }}</a>
        </td>
        <td>{{ item.appKey }}</td>
        <td>{{ item.nameOnPartnerMenu }}</td>
        <td>{{ item.nameOnCourseDetailPage }}</td>
        <td class="text-center">{{ item.displayOrder }}</td>
        <td>
          @if (item.imageFilename) {
            {{ item.imageFilename }}
          } @else {
            <span class="text-muted">—</span>
          }
        </td>
        <td>
          <div class="row-actions">
            <p-button
              icon="pi pi-eye"
              [text]="true"
              [rounded]="true"
              severity="secondary"
              pTooltip="檢視"
              ariaLabel="檢視"
              [routerLink]="['/partners', item.pkid]"
            />
            <p-button
              icon="pi pi-pencil"
              [text]="true"
              [rounded]="true"
              severity="info"
              pTooltip="編輯"
              ariaLabel="編輯"
              [routerLink]="['/partners', item.pkid, 'edit']"
            />
            <p-button
              icon="pi pi-trash"
              [text]="true"
              [rounded]="true"
              severity="danger"
              pTooltip="刪除"
              ariaLabel="刪除"
              (onClick)="confirmDelete(item)"
            />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="8" class="text-center text-muted empty">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer [(visible)]="drawerVisible" position="right" header="搜尋條件" styleClass="filter-drawer">
  <form (ngSubmit)="search()">
    <div class="field">
      <label for="f-keyword">關鍵字</label>
      <input
        pInputText
        id="f-keyword"
        name="keyword"
        [(ngModel)]="filters.keyword"
        placeholder="廠商名稱 / 應用代碼 / 選單名稱 / 圖檔"
      />
    </div>

    <div class="drawer-actions">
      <p-button
        type="button"
        label="清除"
        icon="pi pi-times"
        severity="secondary"
        (onClick)="clearFilters()"
      />
      <p-button type="submit" label="查詢" icon="pi pi-search" />
    </div>
  </form>
</p-drawer>
