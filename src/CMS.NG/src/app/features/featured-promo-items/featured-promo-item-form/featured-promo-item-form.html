<form [formGroup]="form" (ngSubmit)="save()" class="inline-form">
  <div class="field">
    <label for="ff-promotion" class="required">推廣代碼 PromoCode</label>
    <p-autocomplete
      inputId="ff-promotion"
      formControlName="promotion"
      [suggestions]="suggestions()"
      (completeMethod)="searchPromotions($event)"
      (onSelect)="onPromotionSelect($event)"
      optionLabel="promoCode"
      [forceSelection]="true"
      [delay]="250"
      placeholder="輸入推廣代碼查詢"
      emptyMessage="查無推廣代碼"
      appendTo="body"
      [class.ng-dirty]="isInvalid('promotion')"
    >
      <ng-template #item let-p>
        <div class="suggestion">
          <span class="code">{{ p.promoCode }}</span>
          <span class="topic">{{ p.topic }}</span>
        </div>
      </ng-template>
    </p-autocomplete>
    @if (isInvalid('promotion')) {
      <small class="error">請輸入並從清單選擇推廣代碼</small>
    }
  </div>

  <div class="field">
    <label for="ff-topic" class="required">主題 Topic</label>
    <input
      pInputText
      id="ff-topic"
      formControlName="topic"
      maxlength="100"
      [class.ng-dirty]="isInvalid('topic')"
    />
    @if (isInvalid('topic')) {
      <small class="error">{{ textError('topic', '主題', 100) }}</small>
    }
  </div>

  <div class="field">
    <label for="ff-description" class="required">說明 Description</label>
    <input
      pInputText
      id="ff-description"
      formControlName="description"
      maxlength="300"
      [class.ng-dirty]="isInvalid('description')"
    />
    @if (isInvalid('description')) {
      <small class="error">{{ textError('description', '說明', 300) }}</small>
    }
  </div>

  <div class="form-actions">
    <p-button type="submit" label="儲存" icon="pi pi-check" size="small" [loading]="saving()" />
    <p-button
      type="button"
      label="取消"
      icon="pi pi-times"
      size="small"
      severity="secondary"
      (onClick)="cancel()"
    />
    @if (isEdit) {
      <app-row-audit-badge class="audit" tableName="FeaturedPromoItem" [pkid]="draft().pkid" />
    }
  </div>
</form>
