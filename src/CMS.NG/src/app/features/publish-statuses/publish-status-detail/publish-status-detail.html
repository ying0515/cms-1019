<div class="page-header">
  <div class="start">
    <h1 class="title">檢視發布狀態</h1>
    @if (item(); as audited) {
      <app-row-audit-badge tableName="PublishStatus" [pkid]="audited.pkid" />
    }
  </div>
  <div class="actions">
    <p-button label="返回" icon="pi pi-arrow-left" severity="secondary" (onClick)="back()" />
    @if (item()) {
      <p-button
        label="刪除"
        icon="pi pi-trash"
        severity="danger"
        [outlined]="true"
        (onClick)="confirmDelete()"
      />
      <p-button
        label="查看課程"
        icon="pi pi-book"
        severity="help"
        [outlined]="true"
        (onClick)="viewCourses()"
      />
      <p-button label="編輯" icon="pi pi-pencil" (onClick)="edit()" />
    }
  </div>
</div>

@if (loading()) {
  <div class="panel text-muted"><i class="pi pi-spin pi-spinner"></i> 載入中…</div>
} @else if (notFound()) {
  <div class="panel text-muted not-found">找不到此發布狀態資料</div>
} @else if (item(); as s) {
  <section class="panel">
    <h2>發布狀態資料</h2>
    <dl class="view-grid">
      <dt>主代碼</dt>
      <dd>{{ s.pkid }}</dd>
      <dt>狀態名稱</dt>
      <dd class="description">{{ s.description }}</dd>
      <dt>草稿</dt>
      <dd class="is-draft">
        <p-tag [value]="s.isDraft ? '是' : '否'" [severity]="s.isDraft ? 'success' : 'secondary'" />
      </dd>
      <dt>已發布</dt>
      <dd class="is-published">
        <p-tag
          [value]="s.isPublished ? '是' : '否'"
          [severity]="s.isPublished ? 'success' : 'secondary'"
        />
      </dd>
      <dt>已停用</dt>
      <dd class="is-discontinued">
        <p-tag
          [value]="s.isDiscontinued ? '是' : '否'"
          [severity]="s.isDiscontinued ? 'success' : 'secondary'"
        />
      </dd>
    </dl>
  </section>
}
