<!-- One router-outlet whether or not the sidebar shows: swapping outlets on sign-out would
     re-create the current page and re-fire its API calls (all 401). -->
<div class="layout" [class.collapsed]="collapsed()" [class.bare]="!showShell()">
  @if (showShell()) {
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-text">CMS</span>
      <button type="button" class="sidebar-toggle" (click)="toggleSidebar()" aria-label="切換側邊欄">
        <i class="pi" [class.pi-angle-left]="!collapsed()" [class.pi-angle-right]="collapsed()"></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      @for (group of visibleNavGroups(); track group.key) {
        <button type="button" class="nav-group" (click)="toggleGroup(group.key)" [attr.aria-expanded]="!!expanded()[group.key]">
          <i [class]="group.icon"></i>
          <span class="nav-label">{{ group.label }}</span>
          <i class="pi nav-caret" [class.pi-angle-down]="expanded()[group.key]" [class.pi-angle-right]="!expanded()[group.key]"></i>
        </button>
        @if (expanded()[group.key]) {
          <ul class="nav-items">
            @for (item of group.items; track item.route) {
              <li>
                <a [routerLink]="item.route" routerLinkActive="active" [title]="item.label">
                  <i [class]="item.icon"></i>
                  <span class="nav-label">{{ item.label }}</span>
                </a>
              </li>
            }
          </ul>
        }
      }
    </nav>

    <div class="sidebar-user" data-testid="sidebar-user">
      <span class="nav-label user-name" [title]="user()?.userId ?? ''">
        <i class="pi pi-user"></i> {{ user()?.userName }}
      </span>
      <a routerLink="/change-password" title="變更密碼">
        <i class="pi pi-key"></i>
        <span class="nav-label">變更密碼</span>
      </a>
      <button type="button" class="logout" (click)="logout()" title="登出">
        <i class="pi pi-sign-out"></i>
        <span class="nav-label">登出</span>
      </button>
    </div>
  </aside>
  }

  <main class="content">
    <router-outlet />
  </main>
</div>

<p-toast position="top-right" />
<p-confirmdialog />
